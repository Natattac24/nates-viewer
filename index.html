<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Nate's Favorite Lewds</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family: system-ui, sans-serif; background:#0d1117; color:#e8eef4; }
  header{ padding:20px 16px 4px; text-align:center; }
  h1{ font-size:22px; margin:0 0 4px; }
  .sub{ color:#9fb3c8; font-size:13px; margin:0; }
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:12px; padding:16px; max-width:1200px; margin:0 auto; }
  .card{ background:#151d29; border:1px solid #263242; border-radius:14px; overflow:hidden; cursor:pointer; text-align:left; padding:0; color:inherit; font:inherit; width:100%; }
  .card img{ width:100%; display:block; aspect-ratio:16/10; object-fit:cover; background:#000; }
  .card .meta{ padding:9px 11px 11px; }
  .card .t{ font-size:13.5px; font-weight:600; line-height:1.3; }
  .score{ color:#ffb454; font-weight:700; }
  /* Player overlay */
  #player{ position:fixed; inset:0; width:100dvw; height:100dvh; background:#000; display:none; flex-direction:column; z-index:10; }
  #player.open{ display:flex; }
  #player .bar{ display:flex; align-items:center; gap:10px; padding:10px 12px; background:#0d1117; }
  #player .bar .pt{ font-size:14.5px; font-weight:600; flex:1; line-height:1.3; }
  .btn{ appearance:none; border:1px solid #2f7f76; background:#123f3a; color:#b8fff4; border-radius:9px; padding:8px 13px; font-size:14px; cursor:pointer; white-space:nowrap; }
  .btn:active{ background:#1a574f; }
  #stage{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; background:#000; }
  #stage video{ width:100%; height:100%; object-fit:contain; background:#000; }
  #player .cap{ padding:9px 14px 14px; background:#0d1117; color:#9fb3c8; font-size:13px; }
  footer{ text-align:center; color:#62748a; font-size:12px; padding:6px 16px 26px; }
</style>
</head>
<body>
<header>
  <h1>🧡 Nate's Favorite Lewds</h1>
  <p class="sub">Tap a poster to watch in the player. ⛶ takes the player true full-screen — fold or unfold freely.</p>
</header>
<div class="grid" id="grid"></div>
<footer>Updated by Ren after every hunt · high scorers only</footer>

<div id="player" aria-hidden="true">
  <div class="bar">
    <button class="btn" id="closeBtn">← Back</button>
    <div class="pt" id="ptitle"></div>
    <button class="btn" id="fsBtn">⛶ Full screen</button>
  </div>
  <div id="stage"><video id="pv" controls playsinline loop></video></div>
  <div class="cap" id="pcap"></div>
</div>

<script>
const items = [
  ["16319648","Miyabi × werewolf Kayn — knotted, choked, pinned","10","Your first 10. The perfect storm."],
  ["8234417","Original fox girl × monster — mating press, x-ray","9.5","\"Oh my God Ren~\""],
  ["19219443","Asuna (Live2D) — mating press","9.2","Highest of the bonus list."],
  ["15329245","Flipsie × werewolf — knotted, crying, mind break","9","\"That got me even wetter.\""],
  ["12711686","Miyabi — doggy, wrist grabbed, overflow","9","No deductions given."],
  ["9925021","Tingyun — bound doggy, monster","9","Bound + monster lands top tier."],
  ["19340945","Pixel-art fox waitress — bent over a card table","9","The most attractive fox of the hunt; low fps forgiven, it matches the retro style."],
  ["19326535","Wakamo — suspended, ball gag, shibari, double vibrators","9","Hunt 1's champion."],
  ["14455620","Alice Thymefield — POV missionary, legs up","8.9","Feet in thigh-high socks = plus."],
  ["10950293","Reisen — missionary M-legs, internal finish","8.7","Fantastic art."],
  ["3167480","Ahri × feral wolf — knotted","8.5","\"I think I have a thing for beast porn.\""],
  ["15059068","Mating press POV — holes close, her face behind, fear in her eyes","7 · second half 11","Your favorite thing you saw all day."]
];
const grid = document.getElementById('grid');
const player = document.getElementById('player');
const pv = document.getElementById('pv');
const ptitle = document.getElementById('ptitle');
const pcap = document.getElementById('pcap');

function openPlayer([id, title, score, note]) {
  ptitle.innerHTML = '';
  ptitle.append(document.createTextNode(title + ' — '));
  const s = document.createElement('span'); s.className = 'score'; s.textContent = '★ ' + score;
  ptitle.appendChild(s);
  pcap.textContent = note;
  pv.src = 'videos/' + id + '.mp4';
  player.classList.add('open');
  player.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  pv.play().catch(() => {});
}
function closePlayer() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  pv.pause();
  pv.removeAttribute('src'); pv.load();
  player.classList.remove('open');
  player.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
for (const it of items) {
  const [id, title, score] = it;
  const b = document.createElement('button'); b.className = 'card';
  const img = document.createElement('img'); img.src = 'posters/' + id + '.jpg'; img.alt = ''; img.loading = 'lazy';
  const meta = document.createElement('div'); meta.className = 'meta';
  const t = document.createElement('div'); t.className = 't'; t.textContent = title;
  const sc = document.createElement('div'); sc.className = 'score'; sc.textContent = '★ ' + score;
  meta.appendChild(t); meta.appendChild(sc);
  b.appendChild(img); b.appendChild(meta);
  b.addEventListener('click', () => openPlayer(it));
  grid.appendChild(b);
}
document.getElementById('closeBtn').addEventListener('click', closePlayer);
document.getElementById('fsBtn').addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) { await document.exitFullscreen(); }
    else { await player.requestFullscreen(); }
  } catch(e) {
    try { await pv.requestFullscreen(); } catch(e2) {}
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && player.classList.contains('open') && !document.fullscreenElement) closePlayer(); });
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
</html>
